<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
  <title id="title">KT Auto Code 与 KT Auto CAD 功能关系</title>
  <desc id="desc">KT Auto Code 提供基础代码开发工具，KT Auto CAD 作为可选模块增加 CAD 功能，两者共用一个侧边栏。</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#172033" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1000" height="470" rx="22" fill="#f8fafc"/>
  <text x="500" y="50" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif" font-size="28" font-weight="700" fill="#172033">KT Auto Code + KT Auto CAD</text>
  <text x="500" y="80" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif" font-size="16" fill="#64748b">CAD 可选安装，依赖 Code，共用一个侧边栏</text>

  <g filter="url(#shadow)">
    <rect x="55" y="115" width="390" height="275" rx="18" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <rect x="55" y="115" width="390" height="64" rx="18" fill="#2563eb"/>
    <path d="M55 161h390v18H55z" fill="#2563eb"/>
    <text x="250" y="155" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif" font-size="23" font-weight="700" fill="#ffffff">KT Auto Code</text>
    <text x="250" y="208" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#2563eb">基础插件</text>
    <text x="92" y="248" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif" font-size="18" fill="#172033">• 编码、头文件与 Ignore</text>
    <text x="92" y="282" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif" font-size="18" fill="#172033">• 搜索替换、成员排序与 UUID</text>
    <text x="92" y="316" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif" font-size="18" fill="#172033">• Codegen 与 CAA UI</text>
    <text x="92" y="350" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif" font-size="18" fill="#172033">• Git 简报与 Run</text>
  </g>

  <path d="M462 250H532" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="497" y="232" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif" font-size="14" font-weight="600" fill="#64748b">扩展</text>

  <g filter="url(#shadow)">
    <rect x="550" y="115" width="395" height="275" rx="18" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
    <rect x="550" y="115" width="395" height="64" rx="18" fill="#ea580c"/>
    <path d="M550 161h395v18H550z" fill="#ea580c"/>
    <text x="748" y="155" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif" font-size="23" font-weight="700" fill="#ffffff">KT Auto CAD</text>
    <text x="748" y="208" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#ea580c">可选 CAD 模块</text>
    <text x="588" y="248" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif" font-size="18" fill="#172033">• CAD 文件名与工作区扫描</text>
    <text x="588" y="282" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif" font-size="18" fill="#172033">• FCStd 轻量 / 深度读取</text>
    <text x="588" y="316" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif" font-size="18" fill="#172033">• BOM、XLink 与引用查询</text>
    <text x="588" y="350" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif" font-size="18" fill="#172033">• CAD 索引与诊断</text>
  </g>

  <rect x="245" y="414" width="510" height="34" rx="17" fill="#e2e8f0"/>
  <text x="500" y="437" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#475569">只装 Code 使用代码工具；加装 CAD 后增加 CAD 工具</text>
</svg>
