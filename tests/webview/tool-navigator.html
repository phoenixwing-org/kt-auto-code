<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tool Navigator 响应式点检</title>
  <style>
    :root {
      --vscode-foreground: #cccccc;
      --vscode-descriptionForeground: #9d9d9d;
      --vscode-sideBar-background: #181818;
      --vscode-sideBarSectionHeader-background: #202020;
      --vscode-panel-border: #424242;
      --vscode-focusBorder: #007fd4;
      --vscode-list-hoverBackground: #2a2d2e;
      --vscode-list-activeSelectionForeground: #ffffff;
      --vscode-list-activeSelectionBackground: #04395e;
      --vscode-button-foreground: #ffffff;
      --vscode-button-background: #0e639c;
      --vscode-editorWidget-background: #202020;
      --vscode-toolbar-hoverBackground: #303031;
      --vscode-errorForeground: #f48771;
      --vscode-font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --vscode-font-size: 13px;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    body { max-width: 760px; margin: 0; padding: 8px; color: var(--vscode-foreground); background: var(--vscode-sideBar-background); }
    .hint { margin: 0 0 8px; color: var(--vscode-descriptionForeground); font: 12px/1.4 var(--vscode-font-family); }
  </style>
</head>
<body>
  <p class="hint">拖动浏览器宽度，检查大纲单列与网格响应列数。点击叶子只更新选中态。</p>
  <ktc-tool-navigator id="navigator"></ktc-tool-navigator>
  <script src="../../dist/ktc-tool-navigator.js"></script>
  <script>
    const nodes = [
      { kind: "group", id: "cpp-organize", label: "C++ 整理", children: [
        { kind: "tool", id: "auto-build", toolId: "autoBuild", label: "编译工具", description: "CAA / MSVC 批量构建", icon: "build" },
        { kind: "tool", id: "package-includes", toolId: "packageIncludes", label: "头文件引用修正", description: "平铺 include → <KtCore/...>", icon: "file" },
        { kind: "tool", id: "reorder-members", toolId: "reorderMembers", label: "C++ 成员排序", description: "扫描、预览并确认写回", icon: "sort" },
        { kind: "tool", id: "header-ascii", toolId: "headerAscii", label: "头文件 ASCII 修正", description: "预检并修正问题字节", icon: "file" },
      ] },
      { kind: "group", id: "file-tools", label: "文件工具", children: [
        { kind: "tool", id: "encoding-fix", toolId: "encodingFix", label: "编码修正", description: "检查并无损转换项目编码", icon: "file" },
        { kind: "tool", id: "uuid-replace", toolId: "uuidReplace", label: "UUID 替换", description: "扫描映射并确认写入", icon: "uuid" },
      ] },
      { kind: "group", id: "caa", label: "CAA", children: [
        { kind: "tool", id: "caa-dialog", toolId: "caaDialog", label: "CAA UI", description: "扫描 CATDlg 并连接 Desk Tools", icon: "file" },
      ] },
    ];
    const navigator = document.getElementById("navigator");
    const state = { mode: "outline", expanded: true, expandedGroupIds: ["cpp-organize", "file-tools", "caa"], activeToolId: "" };
    const render = () => { navigator.model = { title: "功能目录", nodes, ...state }; };
    navigator.addEventListener("ktc-tool-navigator-action", (event) => {
      const detail = event.detail;
      if (detail.kind === "activate") state.activeToolId = detail.toolId;
      if (detail.kind === "setMode") state.mode = detail.mode;
      if (detail.kind === "setExpanded") state.expanded = detail.expanded;
      if (detail.kind === "setGroupExpanded") {
        const ids = new Set(state.expandedGroupIds);
        if (detail.expanded) ids.add(detail.groupId);
        else ids.delete(detail.groupId);
        state.expandedGroupIds = [...ids];
      }
      render();
    });
    render();
  </script>
</body>
</html>
